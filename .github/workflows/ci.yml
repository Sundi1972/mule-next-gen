name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Balancing simulator smoke run
        run: pnpm sim -- --games 20 --players 4

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @mule/web exec playwright install --with-deps chromium
      - name: Whole-game e2e
        run: pnpm --filter @mule/web e2e
      # The run above uses a random map for coverage; this one replays a seed whose month 2 has a production event.
      - name: Whole-game e2e, pinned seed
        run: pnpm --filter @mule/web exec tsx e2e/smoke.ts
        env:
          MULE_E2E_SEED: '1'
